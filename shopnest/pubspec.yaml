version: 1.0.0+1

environment:
  sdk: ^3.12.2


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  google_fonts: ^8.1.0
  font_awesome_flutter: ^11.0.0
  flutter_spinkit: ^5.2.2
